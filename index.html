<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rust Clicker — Survival</title>
<style>
:root{color-scheme:dark;--bg:#0b0d0e;--panel:#151918;--panel2:#1b201f;--line:#343b39;--text:#e9e6dc;--muted:#9d9b91;--rust:#c96a35;--gold:#f1bd42;--green:#76a85b;--red:#b84a3b;--blue:#5b91ad}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080909;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button{font:inherit;color:inherit}.app{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,#39413d 0,#171c1a 32%,#0a0d0c 75%)}
.app:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.82)),radial-gradient(circle at 50% 45%,rgba(115,92,55,.22),transparent 30%);pointer-events:none}
.top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(8,10,9,.78);backdrop-filter:blur(8px)}
.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--rust)}.stats{display:flex;gap:10px;flex-wrap:wrap}.chip{padding:7px 10px;border:1px solid var(--line);background:#111514cc;border-radius:7px;font-size:12px;color:#ddd}.chip b{color:#fff}
.layout{position:relative;z-index:1;display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:14px;max-width:1500px;margin:auto;padding:14px}.panel{background:linear-gradient(180deg,rgba(25,30,28,.94),rgba(12,15,14,.96));border:1px solid #343b38;border-radius:10px;box-shadow:0 18px 50px #0008;overflow:hidden}.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;margin:0;padding:13px 14px;border-bottom:1px solid #303634;color:#d4d0c5}.side{min-width:0}.quest{padding:12px;border-bottom:1px solid #252b29}.quest:last-child{border:0}.qrow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.bar{height:6px;background:#0a0c0b;border-radius:8px;overflow:hidden;border:1px solid #262c2a}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rust),#e09a4b);width:0;transition:.25s}
.center{min-height:680px;display:flex;flex-direction:column;position:relative}.scene{flex:1;min-height:560px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(150,120,75,.18),transparent 22%),linear-gradient(180deg,#25302c,#121716 58%,#090b0a)}.scene:before{content:"";position:absolute;inset:0;opacity:.28;background-image:radial-gradient(#d6c9a2 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(180deg,transparent,#000 30%,#000)}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:3}.meters{display:flex;gap:7px;flex-wrap:wrap}.meter{background:#0b0e0dcc;border:1px solid #3a413e;border-radius:6px;padding:7px 9px;font-size:11px}.meter b{margin-left:5px}.gather-switch{display:flex;gap:4px;margin-top:6px}.gather{border:1px solid #48504b;background:#151a17;border-radius:4px;padding:5px 7px;font-size:10px;cursor:pointer}.gather.active{background:#49321d;border-color:#c8894a;color:#ffe0a2}.meter.health b{color:#d46a5a}.meter.food b{color:#c7a24e}.meter.water b{color:#70a9c3}
.node{position:absolute;width:min(390px,62vw);height:min(390px,62vw);max-width:390px;max-height:390px;left:50%;top:51%;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;filter:drop-shadow(0 25px 28px #000b)}.rock{position:absolute;inset:10%;border-radius:48% 52% 43% 57%/52% 43% 57% 48%;background:radial-gradient(ellipse at 31% 22%,#c4c2b7 0 4%,transparent 18%),radial-gradient(ellipse at 42% 32%,#a6a59b 0 7%,transparent 24%),radial-gradient(ellipse at 65% 58%,#555a55 0 9%,transparent 27%),linear-gradient(142deg,transparent 0 18%,#d0cec31f 19% 21%,transparent 22% 39%,#090d0c66 40% 43%,transparent 44%),linear-gradient(35deg,#202522 0%,#444943 22%,#777970 43%,#555b55 61%,#2b302c 82%,#171b19 100%);box-shadow:inset 12px 15px 22px #ffffff24,inset -20px -22px 25px #0009,0 0 0 1px #151817,0 14px 24px #0007;overflow:hidden}.rock:before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(117deg,transparent 0 17px,#11171318 18px 20px,transparent 21px 34px),repeating-linear-gradient(22deg,transparent 0 29px,#e4e1d51c 30px 32px,transparent 33px 51px);clip-path:polygon(8% 13%,35% 0,65% 8%,95% 28%,90% 70%,70% 94%,33% 100%,4% 72%,0 36%)}.rock:after{content:"";position:absolute;inset:8%;border-radius:inherit;background:linear-gradient(125deg,transparent 24%,#fff2 25%,transparent 27% 58%,#0004 59%,transparent 61%),linear-gradient(15deg,transparent 45%,#0003 46%,transparent 48%);opacity:.95}.node.metal .rock{background:radial-gradient(ellipse at 32% 22%,#d4d5ce 0 4%,transparent 19%),linear-gradient(145deg,#9da49e,#606b67 35%,#343d39 65%,#171b1a)}.node.sulfur .rock{background:radial-gradient(ellipse at 35% 22%,#ffdc70 0 5%,transparent 18%),linear-gradient(145deg,#e5bb54,#9d782e 35%,#4a371b 70%,#1b1710)}.node.wood .rock{border-radius:48% 52% 43% 57%/52% 43% 57% 48%;background:radial-gradient(ellipse at 50% 19%,#8fb85a 0 15%,transparent 16%),radial-gradient(ellipse at 31% 35%,#6e9b45 0 24%,transparent 25%),radial-gradient(ellipse at 69% 38%,#4f7c34 0 27%,transparent 28%),radial-gradient(ellipse at 47% 51%,#365b2a 0 24%,transparent 25%),linear-gradient(90deg,transparent 42%,#5a3821 43% 57%,transparent 58%);box-shadow:none;filter:drop-shadow(0 14px 12px #0008)}.node.wood .rock:before{background:radial-gradient(ellipse at 36% 31%,#b0d47b55,transparent 23%),radial-gradient(ellipse at 65% 39%,#182b1640,transparent 28%);clip-path:none}.node.wood .rock:after{inset:45% 40% 0;background:repeating-linear-gradient(90deg,#3a2418 0 3px,#8b5b32 4px 7px,#5c3b24 8px 10px);border-radius:4px;opacity:1}
.star{position:absolute;z-index:5;width:74px;height:74px;border-radius:50%;border:2px solid #ffe28a;background:radial-gradient(circle,#fff5b0 0,#f3b928 42%,#c46b19 100%);color:#1b1408;font-size:36px;font-weight:1000;line-height:1;cursor:pointer;box-shadow:0 0 0 7px #f2bb3920,0 0 35px #f0a51c99,0 12px 20px #0009;transform:translate(-50%,-50%);transition:left .12s,top .12s,transform .08s}.star:hover{transform:translate(-50%,-50%) scale(1.08)}.star:active{transform:translate(-50%,-50%) scale(.9)}
.label{position:absolute;bottom:17%;left:50%;transform:translateX(-50%);z-index:2;background:#0b0d0ccc;border:1px solid #4a4f4c;border-radius:7px;padding:8px 13px;font-size:12px;letter-spacing:.5px}.hint{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);color:#c6c0b2;font-size:11px;opacity:.8}
.bottom{border-top:1px solid #2d3331;background:#101312;padding:9px;display:flex;gap:8px;align-items:center;overflow:auto}.slot{min-width:58px;height:58px;border:1px solid #39403d;border-radius:7px;background:#191e1c;display:grid;place-items:center;position:relative;cursor:pointer}.slot.sel{outline:2px solid var(--rust)}.slot span{font-size:24px}.slot small{position:absolute;right:4px;bottom:3px;font-size:10px;color:#ddd}
.recipe{display:flex;align-items:center;gap:9px;width:100%;padding:10px;border:0;border-bottom:1px solid #272d2b;background:transparent;text-align:left;cursor:pointer}.recipe:hover{background:#232925}.recipe:disabled{opacity:.42;cursor:not-allowed}.icon{width:36px;height:36px;border-radius:6px;background:#272d2a;display:grid;place-items:center;font-size:20px}.rtext{min-width:0;flex:1}.rtext b{display:block;font-size:12px}.rtext small{display:block;color:#97988f;font-size:10px;margin-top:2px}.cost{font-size:10px;color:#d7c8a2;text-align:right;line-height:1.5}.tabs{display:flex;padding:8px;gap:6px;border-bottom:1px solid #303634}.tab{flex:1;border:1px solid #353c39;background:#121615;padding:7px;border-radius:6px;font-size:10px;cursor:pointer}.tab.active{background:#35231a;border-color:#8b4b2d;color:#f2c19b}
.resources{padding:11px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.res{display:flex;justify-content:space-between;padding:7px 8px;background:#101413;border:1px solid #2c3330;border-radius:6px;font-size:11px}.res b{color:#eee}.log{max-height:145px;overflow:auto;padding:9px;font-size:10px;color:#aaa}.log div{padding:4px 0;border-bottom:1px solid #202522}.actions{display:flex;gap:7px;padding:9px;border-top:1px solid #2c3330}.actions button{flex:1;padding:8px;border:1px solid #3b413f;background:#171c1a;border-radius:6px;cursor:pointer;font-size:11px}.actions button:hover{background:#252b28}.danger:hover{border-color:#9d4036!important}
.float{position:absolute;z-index:20;pointer-events:none;font-weight:900;font-size:18px;text-shadow:0 2px 5px #000;animation:float 1s ease-out forwards}.miss{position:absolute;z-index:20;pointer-events:none;color:#e08c70;font-weight:900;font-size:14px;animation:miss .65s ease-out forwards}@keyframes float{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-55px)}}@keyframes miss{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-25px)}}
@media(max-width:1050px){.layout{grid-template-columns:220px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.right .panel{height:max-content}}@media(max-width:760px){.top{align-items:flex-start}.stats{justify-content:flex-end}.layout{grid-template-columns:1fr;padding:8px}.left{display:none}.center{min-height:650px}.scene{min-height:530px}.right{display:block}.node{width:330px;height:330px}.star{width:66px;height:66px}.brand{font-size:12px}.chip{padding:6px 7px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top"><div class="brand">RUST <span>CLICKER</span> // SURVIVAL</div><div class="stats"><div class="chip">Уровень <b id="lvl">1</b></div><div class="chip">XP <b id="xp">0</b>/<b id="next">500</b></div><div class="chip">Сила <b id="power">1</b></div><div class="chip">Комбо <b id="combo">0</b>x</div></div></header>
<main class="layout">
<aside class="panel side left"><h2>Задания</h2><div id="quests"></div><h2>Ресурсы</h2><div class="resources" id="resources"></div></aside>
<section class="panel center"><div class="scene" id="scene"><div class="hud"><div class="meters"><div class="meter health">❤ Здоровье <b id="health">100</b></div><div class="meter food">◆ Еда <b id="food">100</b></div><div class="meter water">💧 Вода <b id="water">100</b></div></div><div class="meter">Состояние: <b id="nodeType">Камень</b><div class="gather-switch"><button id="mineRock" class="gather active">⛏ Камень</button><button id="mineWood" class="gather">🪓 Дерево</button></div></div></div><div class="node" id="node"><div class="rock"></div><button class="star" id="star" aria-label="Ударить по руде">★</button><div class="label">Попади по ★</div><div class="hint">Только звезда добывает руду</div></div></div><div class="bottom" id="hotbar"></div></section>
<aside class="right"><div class="panel"><h2>Крафт</h2><div class="tabs"><button class="tab active" data-cat="all">Все</button><button class="tab" data-cat="tools">Инструменты</button><button class="tab" data-cat="combat">Оружие</button><button class="tab" data-cat="base">База</button></div><div id="craft"></div></div><div class="panel" style="margin-top:14px"><h2>Журнал</h2><div class="log" id="log"></div><div class="actions"><button id="save">Сохранить</button><button id="reset" class="danger">Wipe</button></div></div></aside>
</main>
</div>
<script>
const KEY='rust-clicker-save-v1';
const fresh={stone:0,wood:0,metal:0,sulfur:0,cloth:0,scrap:0,xp:0,lvl:1,power:1,combo:0,bestCombo:0,health:100,food:100,water:100,node:'stone',pick:0,axe:0,spear:0,bow:0,furnace:0,bandage:0,hat:0,chest:0,wall:0,box:0,workbench:0};
let s=load(); let category='all';
const recipes=[
 {id:'pick',cat:'tools',icon:'⛏️',name:'Каменная кирка',cost:{stone:100,wood:50},desc:'+2 к силе'},
 {id:'axe',cat:'tools',icon:'🪓',name:'Каменный топор',cost:{stone:100,wood:50},desc:'+1 к силе'},
 {id:'furnace',cat:'base',icon:'🔥',name:'Печь',cost:{stone:200,wood:100},desc:'переплавляет камень'},
 {id:'workbench',cat:'base',icon:'🛠️',name:'Верстак I',cost:{wood:250,stone:150},desc:'открывает продвинутый крафт'},
 {id:'wall',cat:'base',icon:'🧱',name:'Каменная стена',cost:{stone:300,wood:50},desc:'часть базы'},
 {id:'box',cat:'base',icon:'📦',name:'Ящик',cost:{wood:250,metal:25},desc:'хранилище'},
 {id:'spear',cat:'combat',icon:'🔱',name:'Копьё',cost:{stone:100,wood:200},desc:'оружие ближнего боя'},
 {id:'bow',cat:'combat',icon:'🏹',name:'Лук',cost:{wood:300,cloth:50},desc:'дальний бой'},
 {id:'hat',cat:'combat',icon:'🪖',name:'Шлем',cost:{wood:100,cloth:50},desc:'защита'},
 {id:'chest',cat:'combat',icon:'🛡️',name:'Самодельный жилет',cost:{wood:200,cloth:100},desc:'защита'},
 {id:'bandage',cat:'combat',icon:'🩹',name:'Бинт',cost:{cloth:20},desc:'+25 здоровья'}
];
const names={stone:'Камень',wood:'Дерево',metal:'Металл',sulfur:'Сера',cloth:'Ткань',scrap:'Скрап'};
const emoji={stone:'🪨',wood:'🪵',metal:'🔩',sulfur:'🟡',cloth:'🧵',scrap:'⚙️'};
function load(){try{return {...fresh,...JSON.parse(localStorage.getItem(KEY)||'null')}}catch{return {...fresh}}}
function save(){localStorage.setItem(KEY,JSON.stringify(s)); toast('Игра сохранена')}
function fmtCost(c){return Object.entries(c).map(([k,v])=>`${emoji[k]} ${v}`).join(' · ')}
function can(c){return Object.entries(c).every(([k,v])=>s[k]>=v)}
function log(t){const el=document.getElementById('log');const d=document.createElement('div');d.textContent=t;el.prepend(d);while(el.children.length>35)el.lastChild.remove()}
function toast(t){log('» '+t)}
function render(){
 document.getElementById('mineRock').classList.toggle('active',s.node!=='wood');document.getElementById('mineWood').classList.toggle('active',s.node==='wood');
 document.getElementById('lvl').textContent=s.lvl;document.getElementById('xp').textContent=s.xp;document.getElementById('next').textContent=s.lvl*500;document.getElementById('power').textContent=s.power;document.getElementById('combo').textContent=s.combo;document.getElementById('health').textContent=Math.round(s.health);document.getElementById('food').textContent=Math.round(s.food);document.getElementById('water').textContent=Math.round(s.water);
 const n=document.getElementById('node');n.className='node '+s.node;document.getElementById('nodeType').textContent=names[s.node];
 const res=document.getElementById('resources');res.innerHTML=Object.keys(names).map(k=>`<div class="res"><span>${emoji[k]} ${names[k]}</span><b>${s[k]}</b></div>`).join('');
 document.getElementById('quests').innerHTML=[['Камнекопатель',s.stone,500,'stone'],['Сделай кирку',s.pick,1,'pick'],['Поставь печь',s.furnace,1,'furnace'],['Построй базу',s.wall,3,'wall']].map(q=>`<div class="quest"><div class="qrow"><span>${q[0]}</span><span>${Math.min(q[1],q[2])}/${q[2]}</span></div><div class="bar"><i style="width:${Math.min(100,q[1]/q[2]*100)}%"></i></div></div>`).join('');
 const list=recipes.filter(r=>category==='all'||r.cat===category);document.getElementById('craft').innerHTML=list.map(r=>`<button class="recipe" data-craft="${r.id}" ${can(r.cost)?'':'disabled'}><div class="icon">${r.icon}</div><div class="rtext"><b>${r.name}</b><small>${r.desc}</small></div><div class="cost">${fmtCost(r.cost)}</div></button>`).join('');
 document.querySelectorAll('[data-craft]').forEach(b=>b.onclick=()=>craft(b.dataset.craft));
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.cat===category));
 renderHotbar();
}
function renderHotbar(){const items=[['⛏️','Кирка',s.pick],['🪓','Топор',s.axe],['🔱','Копьё',s.spear],['🏹','Лук',s.bow],['🔥','Печь',s.furnace],['🩹','Бинт',s.bandage],['🧱','Стена',s.wall]];document.getElementById('hotbar').innerHTML=items.map((x,i)=>`<div class="slot ${i===0?'sel':''}" title="${x[1]}"><span>${x[0]}</span><small>${x[2]}</small></div>`).join('')}
function moveStar(){const st=document.getElementById('star');st.style.left=(18+Math.random()*64)+'%';st.style.top=(18+Math.random()*64)+'%'}
function gainXp(v){s.xp+=v;while(s.xp>=s.lvl*500){s.xp-=s.lvl*500;s.lvl++;s.power++;toast('Новый уровень! Сила +1')}}
function float(t,x,y,cls='float'){const d=document.createElement('div');d.className=cls;d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';document.getElementById('scene').appendChild(d);setTimeout(()=>d.remove(),1000)}
function hit(){
 const node=document.getElementById('node'),rect=node.getBoundingClientRect(),scene=document.getElementById('scene').getBoundingClientRect();
 const amount=Math.max(1,Math.floor(s.power*(1+s.combo*.06)));s[s.node]+=amount;gainXp(amount*2);s.combo++;s.bestCombo=Math.max(s.bestCombo,s.combo);
 if(s.node!=='wood'){if(Math.random()<.13)s.scrap++;if(Math.random()<.18)s.cloth++;if(Math.random()<.12)s.wood++;}else{if(Math.random()<.12)s.cloth++;}
 s.food=Math.max(0,s.food-.25);s.water=Math.max(0,s.water-.35);
 float('+'+amount+' '+names[s.node],rect.left-scene.left+rect.width/2,rect.top-scene.top+rect.height/2);
 node.animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:'translate(-50%,-50%) scale(1.07)'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:180});
 moveStar(); if(s.node!=='wood'&&Math.random()<.16){s.node=['stone','metal','sulfur'][Math.floor(Math.random()*3)];toast('Руда в жиле изменилась: '+names[s.node])} render();
}
function miss(e){s.combo=0;const r=document.getElementById('scene').getBoundingClientRect();float('МИМО!',e.clientX-r.left,e.clientY-r.top,'miss');render()}
function craft(id){const r=recipes.find(x=>x.id===id);if(!r||!can(r.cost))return;Object.entries(r.cost).forEach(([k,v])=>s[k]-=v);s[id]++;if(id==='pick')s.power+=2;if(id==='axe')s.power+=1;if(id==='bandage')s.health=Math.min(100,s.health+25);toast('Создано: '+r.name);render()}
function reset(){if(confirm('Сделать полный Wipe и начать заново?')){s={...fresh};localStorage.removeItem(KEY);document.getElementById('log').innerHTML='';toast('Wipe выполнен');moveStar();render()}}
document.getElementById('star').addEventListener('click',e=>{e.stopPropagation();hit()});document.getElementById('mineRock').onclick=()=>{s.node='stone';toast('Вы выбрали каменную жилу');render()};document.getElementById('mineWood').onclick=()=>{s.node='wood';toast('Вы выбрали дерево. Попадай по ★, чтобы добывать древесину');render()};document.getElementById('scene').addEventListener('click',e=>{if(e.target.id!=='star')miss(e)});document.getElementById('save').onclick=save;document.getElementById('reset').onclick=reset;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()});
setInterval(()=>{if(s.furnace>0&&s.stone>=5){s.stone-=5;s.metal+=s.furnace;toast('Печь переплавила камень → металл')}if(Math.random()<.2)s.wood++;s.food=Math.max(0,s.food-.08);s.water=Math.max(0,s.water-.12);if(s.food===0||s.water===0)s.health=Math.max(1,s.health-.15);render()},2500);
moveStar();log('Система запущена. Попадай только по ★');render();
</script>
</body>
</html>
